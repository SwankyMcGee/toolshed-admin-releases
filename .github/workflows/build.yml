name: build

# Every push and pull request: compile, unit-test, and (on main) build
# the signed release APK and attach it to the run.
#
# Before this, the release dance was four commands typed by hand —
# gradle, copy, zip, gh release create — and the only check that the
# app still compiled was remembering to build it. The unit tests are
# JVM tests over the pure logic (Stats, UsageStats, the registry
# lookups), so they run in seconds without an emulator.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The wrapper pins the Gradle version, so CI and a laptop build
      # the same thing. Make it runnable on Linux.
      - name: Make the wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testReleaseUnitTest --console=plain

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testReleaseUnitTest
          retention-days: 14

  apk:
    name: release apk
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make the wrapper executable
        run: chmod +x gradlew

      # The keystore is a repository secret, decoded at build time. A
      # fork without it still gets the tests — only the signed APK is
      # skipped, rather than the whole workflow failing.
      #
      # The keystore alone is not enough: the passwords are separate
      # secrets, and the release signing config is only created when all
      # three are present (build.gradle.kts has no default — a password
      # written there would be public with the repo). A missing one makes
      # Gradle warn and produce an unsigned APK, which looks exactly like
      # a signed one from here, so the next step checks.
      - name: Decode keystore
        id: keystore
        continue-on-error: true
        env:
          KEYSTORE_BASE64: ${{ secrets.TOOLSHED_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "no keystore secret; skipping the APK"
            echo "have=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/toolshed-release.keystore"
          echo "have=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        if: steps.keystore.outputs.have == 'true'

        env:
          TOOLSHED_KEYSTORE: ${{ runner.temp }}/toolshed-release.keystore
          TOOLSHED_KEYSTORE_PASSWORD: ${{ secrets.TOOLSHED_KEYSTORE_PASSWORD }}
          TOOLSHED_KEY_ALIAS: ${{ secrets.TOOLSHED_KEY_ALIAS }}
          TOOLSHED_KEY_PASSWORD: ${{ secrets.TOOLSHED_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain

      # The gate that makes "unsigned" loud. Without it a missing
      # TOOLSHED_KEYSTORE_PASSWORD produces an APK that installs nowhere
      # useful and still gets uploaded as a release artifact.
      - name: Verify the APK is signed
        if: steps.keystore.outputs.have == 'true'
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          if [ -z "$SIGNER" ]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          "$SIGNER" verify --print-certs "$APK"

      - name: Upload APK
        if: steps.keystore.outputs.have == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: toolshed-admin-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
